      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; Section 9.3: STATUS / ACKNACK Sequence Acknowledgment</text>
      <text x="36" y="406" fill="#f1f5f9" font-size="13">&#x2713; Section 9.5: Embedded Link Budget with Sub-8 Byte Base Overhead</text>
      <text x="36" y="446" fill="#f1f5f9" font-size="13">&#x2713; Ecosystem: PX4 Autopilot &amp; micro-ROS uORB Bridge Interoperability</text>
