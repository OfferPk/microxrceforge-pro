  <text x="64" y="38" fill="#f8fafc" font-size="20" font-weight="800">MicroXRCEForge <tspan fill="#38bdf8">Pro</tspan></text>
  <rect x="250" y="22" width="70" height="20" rx="4" fill="#1e293b"/>
  <text x="285" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">v1.0.0</text>
  <rect x="860" y="20" width="300" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
