    <text x="95" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Handshake Client</text>
    <rect x="190" y="250" width="150" height="40" rx="6" fill="#334155"/>
    <text x="265" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Publish (WRITE)</text>
  </g>
  <g transform="translate(430, 90)">
    <rect width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
