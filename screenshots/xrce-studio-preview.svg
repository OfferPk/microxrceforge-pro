    <text x="20" y="70" fill="#38bdf8" font-size="28" font-weight="800">4 <tspan font-size="16" fill="#64748b">bytes</tspan></text>
    <rect x="250" y="0" width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">SUBMESSAGE FRAMING</text>
    <text x="270" y="70" fill="#34d399" font-size="28" font-weight="800">4 <tspan font-size="16" fill="#64748b">bytes</tspan></text>
    <rect x="495" y="0" width="235" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="515" y="32" fill="#94a3b8" font-size="12" font-weight="600">MCU RAM FOOTPRINT</text>
    <text x="515" y="70" fill="#facc15" font-size="28" font-weight="800">1.8 <tspan font-size="16" fill="#64748b">KB</tspan></text>
    <g transform="translate(0, 130)">
      <rect width="730" height="510" rx="12" fill="#0f172a" stroke="#1e293b"/>
