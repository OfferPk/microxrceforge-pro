    <text x="36" y="100" fill="#38bdf8" font-size="13" font-family="monospace">Session: 0x81 | Stream: 0x80</text>
    <rect x="20" y="140" width="320" height="90" rx="6" fill="#1e293b"/>
    <text x="36" y="170" fill="#94a3b8" font-size="12">Topic: rt/turtle1/cmd_vel (CDR Encapsulated)</text>
